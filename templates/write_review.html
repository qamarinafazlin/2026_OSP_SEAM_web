{% extends "base.html" %}

{% block title %}Write a review{% endblock %}

{% block section %}


<div class="write-review-page">

    <header class="write-review-heading">
        <h1>Write a review</h1>
        <p>Tried something new? Help the next person decide.</p>
    </header>

    <form class="write-review-form"
          action="/reg_review"
          method="POST"
          enctype="multipart/form-data">

        <div class="write-review-grid">

            <div class="write-review-field">
                <label for="reviewer_id">Reviewer ID</label>
                <input
                    type="text"
                    id="reviewer_id"
                    name="reviewer_id"
                    value="{{ session.get('id', '') }}"
                    placeholder="Ewha kim"
                    readonly
                >
                <small class="write-review-hint">
                    Filled in from your account.
                </small>
            </div>

            <div class="write-review-field">
                <label for="product_name">Product name</label>
                <input
                    type="text"
                    id="product_name"
                    name="product_name"
                    placeholder="e.g Super ring"
                    required
                >
            </div>

        </div>

        <div class="write-review-field">
            <span class="write-review-label">Rating</span>

            <div class="write-review-rating">

                <div class="write-review-stars" id="rating-stars">
                    <button type="button" data-rating="1">★</button>
                    <button type="button" data-rating="2">★</button>
                    <button type="button" data-rating="3">★</button>
                    <button type="button" data-rating="4">★</button>
                    <button type="button" data-rating="5">★</button>
                </div>

                <span class="write-review-rating-text"
                      id="rating-text">4/5 Really liked it</span>

            </div>

            <input type="hidden" name="rating" id="rating-value" value="4">
        </div>

        <div class="write-review-field">
            <label for="title">Review Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Sum it up in one line"
                maxlength="100"
                required
            >
        </div>

        <div class="write-review-field">
            <label for="content">Review</label>
            <textarea
                id="content"
                name="content"
                maxlength="1000"
                placeholder="Taste, texture, price, how the pick up went..."
                required
            ></textarea>

            <div class="write-review-counter">
                <span id="review-count">0</span> / 1000
            </div>
        </div>

        <div class="write-review-field">
            <label for="review-image">Picture</label>

            <label class="write-review-upload" for="review-image">
                <span id="upload-placeholder">Upload image</span>
                <img id="upload-preview" alt="Selected image" hidden>
            </label>

            <input
                type="file"
                id="review-image"
                name="image"
                accept="image/jpeg,image/png,image/webp"
                class="write-review-file"
            >
        </div>

        <div class="write-review-actions">
            <a href="/review" class="btn btn-ghost">Cancel</a>
            <button type="submit" class="btn btn-primary">
                Post a review
            </button>
        </div>

    </form>

</div>

{% endblock %}

{% block scripts %}
<script>
const starButtons = document.querySelectorAll(
    "#rating-stars button"
);
const ratingValue = document.getElementById("rating-value");
const ratingText = document.getElementById("rating-text");

const ratingLabels = [
    "",
    "Didn't like it",
    "Could be better",
    "It was okay",
    "Really liked it",
    "Loved it"
];

function setRating(value) {
    ratingValue.value = value;

    starButtons.forEach(button => {
        button.classList.toggle(
            "selected",
            Number(button.dataset.rating) <= value
        );
    });

    ratingText.textContent =
        value + "/5 " + ratingLabels[value];
}

starButtons.forEach(button => {
    button.addEventListener("click", () => {
        setRating(Number(button.dataset.rating));
    });
});

setRating(4);

const reviewContent = document.getElementById("content");
const reviewCount = document.getElementById("review-count");

reviewContent.addEventListener("input", () => {
    reviewCount.textContent = reviewContent.value.length;
});

const imageInput = document.getElementById("review-image");
const imagePreview = document.getElementById("upload-preview");
const imagePlaceholder = document.getElementById("upload-placeholder");

let previewUrl;

imageInput.addEventListener("change", () => {
    const file = imageInput.files[0];

    if (previewUrl) {
        URL.revokeObjectURL(previewUrl);
        previewUrl = null;
    }

    imagePreview.hidden = true;
    imagePreview.removeAttribute("src");
    imagePlaceholder.hidden = false;

    if (!file) return;

    if (!["image/jpeg", "image/png", "image/webp"].includes(file.type)) {
        alert("Please choose a JPG, PNG, or WebP image.");
        imageInput.value = "";
        return;
    }

    previewUrl = URL.createObjectURL(file);
    imagePreview.src = previewUrl;
    imagePreview.hidden = false;
    imagePlaceholder.hidden = true;
});
</script>
{% endblock %}
